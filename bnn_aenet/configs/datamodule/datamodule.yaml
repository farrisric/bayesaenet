_target_: bnn_aenet.datamodule.aenet_datamodule.AenetDataModule

# Dataset name (used for organizing logs)
name: default

data_dir: ${paths.data_dir}/train.in
device: 'cpu'
batch_size: 100
test_split: 0.1
valid_split: 0.1

# Fraction of the non-test pool to use for train+valid (default 1.0 = all).
# The test set is carved out first and stays identical across fractions,
# so experiments at different train_fraction values are directly comparable.
train_fraction: 1.0

# Split configuration name (unused for now; reserved for future global-index system)
split_config: null
