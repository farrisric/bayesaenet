# @package _global_

defaults:
  - override /model: bnn_forces_aux
  - override /callbacks: default
  - override /trainer: default

tags: ["bayesian", "flipout", "forces", "auxiliary"]

seed: 12345

trainer:
  min_epochs: 5000
  max_epochs: 50000

callbacks:
  model_checkpoint:
    monitor: rmse/val
  
  early_stopping:
    monitor: rmse/val
    patience: 100

model:
  name: fo_forces  # Used for log directory organization
  fit_context: flipout
  guide: normal
  net:
    alpha: 0.1  # FIXED at 0.1 (not optimized to avoid Optuna bias)