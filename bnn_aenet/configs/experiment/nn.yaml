# @package _global_

defaults:
  - override /model: nn
  - override /callbacks: default
  - override /trainer: default

tags: ["nn", "deep_ensemble"]

seed: 12345

trainer:
  min_epochs: 5000
  max_epochs: 50000

callbacks:
  model_checkpoint:
    monitor: total_rmse/val
  early_stopping:
    monitor: total_rmse/val
    patience: 500