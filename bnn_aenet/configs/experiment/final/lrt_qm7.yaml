# @package _global_
# Final training configuration for LRT BNN on QM7 dataset
# Optimized hyperparameters from HPS

defaults:
  - override /model: bnn_lrt
  - override /datamodule: QM7
  - override /callbacks: default
  - override /trainer: gpu

tags: ["final", "bayesian", "lrt", "qm7"]

# Reproducibility
seed: 42

trainer:
  min_epochs: 5000
  max_epochs: 50000
  accelerator: gpu
  devices: 1
  deterministic: false  # Set to true for full reproducibility (slower)

model:
  lr: 0.0009549627167707569
  prior_scale: 0.026705525180274015
  q_scale: 0.0005171823159504436
  obs_scale: 0.47612142594698453
  mc_samples_train: 2
  mc_samples_eval: 50  # More samples for final evaluation
  pretrain_epochs: 0

callbacks:
  model_checkpoint:
    monitor: mse/val
    mode: min
    save_top_k: 3
    save_last: true

  early_stopping:
    monitor: mse/val
    patience: 200
    mode: min
