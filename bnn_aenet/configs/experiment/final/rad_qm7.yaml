# @package _global_
# Final training configuration for Radial BNN on QM7 dataset
# Optimized hyperparameters from HPS

defaults:
  - override /model: bnn_rad
  - override /datamodule: QM7
  - override /callbacks: default
  - override /trainer: gpu

tags: ["final", "bayesian", "radial", "qm7"]

# Reproducibility
seed: 42

trainer:
  min_epochs: 5000
  max_epochs: 50000
  accelerator: gpu
  devices: 1
  deterministic: false

model:
  lr: 0.0009788619025802843
  prior_scale: 0.019240951470053693
  q_scale: 0.002223982343432341
  obs_scale: 0.990878816554534
  mc_samples_train: 2
  mc_samples_eval: 50
  pretrain_epochs: 5

callbacks:
  model_checkpoint:
    monitor: mse/val
    mode: min
    save_top_k: 3
    save_last: true

  early_stopping:
    monitor: mse/val
    patience: 200
    mode: min
