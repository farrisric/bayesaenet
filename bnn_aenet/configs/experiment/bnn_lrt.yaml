# @package _global_

defaults:
  - override /model: bnn
  - override /callbacks: default
  - override /trainer: default

tags: ["bayesian", "lrt"]

seed: 12345

trainer:
  min_epochs: 5000
  max_epochs: 50000

callbacks:
  model_checkpoint:
    monitor: total_rmse/val
  early_stopping:
    monitor: total_rmse/val
    patience: 100

model:
  name: lrt
  fit_context: lrt
  guide: normal
  net:
    alpha: 0.1  # FIXED at 0.1 (not optimized to avoid Optuna bias)
