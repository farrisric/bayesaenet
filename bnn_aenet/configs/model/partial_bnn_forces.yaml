defaults:
  - net

_target_: bnn_aenet.models.bnn.PartialBNN_Forces_Aux

# Model name (used for organizing logs)
name: PartialBNN_Forces

# Bayesian layer configuration
# Options:
#   - "all": All layers Bayesian (standard BNN behavior)
#   - "last": Only last linear layer of each species subnet (fast, often effective)
#   - "first": Only first linear layer
#   - "first_last": Both first and last layers
#   - [0, 2]: Specific layer indices (0-indexed)
bayesian_layers: last

lr: 0.0001
pretrain_epochs: 0
mc_samples_train: 2
mc_samples_eval: 20
dataset_size: ??? # Set by datamodule
fit_context: lrt
guide: normal
prior_loc: 0
prior_scale: 0.1
q_scale: 0.001
obs_scale: 0.5

# Force training parameters
force_lr_scale: 0.1  # Learning rate scale for force updates relative to main lr
scale_lr_factor: 0.5  # Learning rate factor for scale (uncertainty) parameter updates
grad_clip_val: 1.0  # Max gradient norm for force gradient clipping (prevents NaN)
