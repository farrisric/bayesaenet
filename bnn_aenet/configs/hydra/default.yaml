# https://hydra.cc/docs/configure_hydra/intro/

# enable color logging
defaults:
  - override hydra_logging: colorlog
  - override job_logging: colorlog

# output directory, generated dynamically on each run
# Structure: logs/{model}/{task}/{run_name}
# Example: logs/lrt_forces/hpsearch/2026-02-05_14-30-00
run:
  dir: ${paths.log_dir}/${model.name}/${task_name}/${run_name}
sweep:
  dir: ${paths.log_dir}/${model.name}/${task_name}/multiruns/${now:%Y-%m-%d}_${now:%H-%M-%S}
  subdir: ${hydra.job.num}

