# https://hydra.cc/docs/configure_hydra/intro/

# enable color logging
defaults:
  - override hydra_logging: colorlog
  - override job_logging: colorlog

# output directory, generated dynamically on each run
# Structure: bnn_aenet/logs/{dataset}/{task_name}/runs/{model}/{run_name}
# Example: bnn_aenet/logs/TiO2_small/train/runs/lrt/lrt_train_0
run:
  dir: ${paths.task_dir}/${task_name}/runs/${model.name}/${run_name}
sweep:
  dir: ${paths.task_dir}/${task_name}/runs/${model.name}/multiruns/${now:%Y-%m-%d}_${now:%H-%M-%S}
  subdir: ${hydra.job.num}

# Old flat structure (deprecated):
