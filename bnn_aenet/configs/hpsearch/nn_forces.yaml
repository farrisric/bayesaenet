# @package _global_
# Hyperparameter search for NN with Forces (Deep Ensemble)

defaults:
  - /hpsearch/study: study
  - /hpsearch/objective: nn_forces
  - override /experiment: nn_forces

hpsearch:
  monitor: total_rmse/val  # Combined energy + force RMSE
  n_trials: 30
  study:
    study_name: nn_forces

trainer:
  max_epochs: 3000
  min_epochs: 100

callbacks:
  early_stopping:
    monitor: total_rmse/val
    patience: 50
    mode: min

tags: ["nn", "forces", "hps"]
