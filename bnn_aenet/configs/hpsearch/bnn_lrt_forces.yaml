# @package _global_
# Hyperparameter search for LRT BNN with Forces

defaults:
  - /hpsearch/study: study
  - /hpsearch/objective: bnn_forces
  - override /experiment: bnn_lrt_forces_aux

hpsearch:
  monitor: total_rmse/val  # Combined energy + force RMSE
  n_trials: 30
  study:
    study_name: bnn_lrt_forces

trainer:
  max_epochs: 3000
  min_epochs: 100

callbacks:
  early_stopping:
    monitor: total_rmse/val
    patience: 50
    mode: min

tags: ["bayesian", "lrt", "forces", "hps"]
