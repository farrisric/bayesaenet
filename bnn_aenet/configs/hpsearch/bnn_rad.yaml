# @package _global_
# Hyperparameter search for BNN (Radial)

defaults:
  - /hpsearch/study: study
  - /hpsearch/objective: bnn
  - override /experiment: bnn_rad

hpsearch:
  monitor: total_rmse/val
  n_trials: 30
  study:
    study_name: bnn_rad_forces_likelihood  # Keep for DB compat

trainer:
  max_epochs: 3000
  min_epochs: 100

callbacks:
  early_stopping:
    monitor: total_rmse/val
    patience: 50
    mode: min

tags: ["bayesian", "radial", "hps"]
